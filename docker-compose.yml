services:
  # The original reconstructed service: a Node http server with the game welded
  # into it. Kept alongside the port so the two can be compared directly; the
  # web service below does the same job and does not talk to it.
  # nyc:
  #   build: .
  #   image: nyc-world:0.2.8
  #   container_name: nyc-world
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     # PORT and BASE_PATH must agree with the client's build-time base (/world).
  #     PORT: 8080
  #     BASE_PATH: /world
  #     # ADMIN=1 makes every connecting player an admin (enables noclip fly, teleport).
  #     ADMIN: "0"
  #     # VERBOSE=1 logs the client's boot/crash telemetry beacons.
  #     VERBOSE: "0"
  #   restart: unless-stopped

  # The same service ported to SvelteKit: the mirrored client and tiles, the REST
  # endpoints, the pages and the authoritative game loop, all in one process.
  # Its world is its own — the two containers do not share players or scores.
  web:
    build:
      # The repo root, because the image also carries public/.
      context: .
      dockerfile: web/Dockerfile
    image: nyc-world-web:0.2.8
    container_name: nyc-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # The client is built with BASE_URL=/world/, so this stays /world.
      BASE_PATH: /world
      ADMIN: "0"
      VERBOSE: "0"
    restart: unless-stopped

  # The same service under `vite dev`, for working on the client:
  #
  #   docker compose --profile dev up web-dev   ->  http://localhost:5173/world/
  #
  # web/src, web/static and the whole mirrored public/ tree are bind-mounted, and
  # vite.config.js watches the client bundle under public/world/assets, so saving
  # an edit there reloads the browser. In development static.js also drops the
  # `immutable` cache header the production service sends: the mirrored files
  # carry the *origin's* content hashes, which do not change when the bytes
  # behind them do, so without that a browser keeps running the old worker.
  #
  # A separate profile and a separate port, so `docker compose up` still brings
  # up only the production service on 3000.
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    image: nyc-world-web-dev:0.2.8
    container_name: nyc-web-dev
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5173
      BASE_PATH: /world
      ADMIN: "1"
      VERBOSE: "1"
      # Bind mounts do not always deliver inotify events on macOS and Windows.
      # Set to 1 if saving a file does not reload the page.
      VITE_POLL: "0"
    volumes:
      - ./web/src:/app/src:ro
      - ./web/static:/app/static:ro
      - ./web/vite.config.js:/app/vite.config.js:ro
      - ./web/svelte.config.js:/app/svelte.config.js:ro
      - ./web/jsconfig.json:/app/jsconfig.json:ro
      - ./public:/app/public:ro
